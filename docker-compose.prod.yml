# Production docker-compose for Raspberry Pi
# Pulls images from Mac registry at 100.121.189.88:5001
# Usage: docker compose -f docker-compose.prod.yml up -d
# With logging: docker compose -f docker-compose.prod.yml -f docker-compose.logging.yml up -d

services:
  # Python Collector Service V3 - APScheduler + State Persistence
  python-scheduler:
    image: 100.121.189.88:5001/python-scheduler:latest
    platform: linux/arm64
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - MINERS_CONFIG=/app/etc/miners.yaml
      - POOLS_CONFIG=/app/etc/pools.yaml
      - COLLECTION_INTERVAL=${COLLECTION_INTERVAL:-2}
      - POOL_TEST_INTERVAL=${POOL_TEST_INTERVAL:-5}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BACKEND_URL=http://backend:5000
      - PUSH_TO_BACKEND=${PUSH_TO_BACKEND:-true}
      - SYSTEM_API_KEY=${SYSTEM_API_KEY:-}
      - USE_DATABASE_CONFIG=${USE_DATABASE_CONFIG:-true}
    volumes:
      - ./etc:/app/etc
      - ./data/python-scheduler:/app/data
    # DMI-58: the scheduler fetches its entire miner list from the backend API.
    # Started first, it cannot resolve `backend`, falls back to the example
    # miners in etc/miners.yaml and polls those instead of the real fleet.
    # This dependency used to point the other way (backend -> scheduler), which
    # is backwards: the backend has no code path that calls the scheduler
    # (JOB_RUNNER_URL is unused), while the scheduler cannot work without it.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mining-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: 100.121.189.88:5001/frontend:latest
    platform: linux/arm64
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mining-network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 not localhost: localhost resolves to IPv6 ::1 but nginx is IPv4-only (DMI-17)
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: 100.121.189.88:5001/backend:latest
    platform: linux/arm64
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - MINER_CONFIG_PATH=/opt/mining-stack/etc/miners.yaml
      - DATA_DIR=/app/data
      - JOB_RUNNER_URL=http://python-scheduler:8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ADMIN_TELEGRAM_CHAT_ID=${ADMIN_TELEGRAM_CHAT_ID:-}
      - SYSTEM_API_KEY=${SYSTEM_API_KEY:-}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./etc:/opt/mining-stack/etc
      - ./bin:/opt/mining-stack/bin:ro
      - ./venv:/opt/mining-stack/venv:ro
      - ./docker/prometheus/rules:/app/prometheus-rules
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped
    networks:
      - mining-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    platform: linux/arm64
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus
      - ./docker/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - mining-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    platform: linux/arm64
    container_name: blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./docker/blackbox:/etc/blackbox_exporter
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    networks:
      - mining-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Uplink health and traffic accounting for the Keenetic router (DMI-47).
  # Needs LAN reachability to the router, so it must not be isolated from it.
  router-exporter:
    build:
      context: ./router-exporter
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: router-exporter
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    ports:
      - "9101:9101"
    environment:
      - ROUTER_HOST=${ROUTER_HOST:-192.168.2.1}
      - ROUTER_USER=${ROUTER_USER:-admin}
      # Required. The exporter refuses to start without it rather than silently
      # reporting router_up 0 forever.
      - ROUTER_PASSWORD=${ROUTER_PASSWORD:?ROUTER_PASSWORD must be set}
      - ROUTER_SNMP_COMMUNITY=${ROUTER_SNMP_COMMUNITY:-public}
      - ROUTER_UPLINK_INTERFACE=${ROUTER_UPLINK_INTERFACE:-CdcEthernet2}
    networks:
      - mining-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics', timeout=8)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Restarts the router when the uplink stays down (DMI-49).
  #
  # SHIPS DISARMED. With WAN_WATCHDOG_ARM unset it only logs what it would have
  # done, which is the right default for a fresh install: arming is a decision
  # about rebooting a production router, not something to inherit from a file.
  #
  # Runs on the Pi rather than the router so it survives the reboot it triggers,
  # and needs no depends_on: it probes the internet directly and treats a missing
  # Prometheus as "unknown" rather than as a fault.
  wan-watchdog:
    build:
      context: .
      dockerfile: watchdog/Dockerfile
    platform: linux/arm64
    container_name: wan-watchdog
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    environment:
      - WAN_WATCHDOG_ARM=${WAN_WATCHDOG_ARM:-false}
      - ROUTER_HOST=${ROUTER_HOST:-192.168.2.1}
      - ROUTER_USER=${ROUTER_USER:-admin}
      # Only needed once armed; the watchdog refuses to start armed without it
      # rather than running with an action that would fail when called upon.
      - ROUTER_PASSWORD=${ROUTER_PASSWORD:-}
      - PROMETHEUS_URL=http://prometheus:9090
      - WAN_WATCHDOG_STATE=/var/lib/mining-stack/wan_watchdog.json
    volumes:
      # The action budget must survive restarts, or a crash-looping container
      # gets a fresh one each time and can reboot the router repeatedly.
      - watchdog_state:/var/lib/mining-stack
    networks:
      - mining-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:latest
    platform: linux/arm64
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    networks:
      - mining-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    platform: linux/arm64
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Grafana 11.5+ downloads a set of plugins on every start. On this
      # 4G-metered link that cost minutes of startup and needless traffic,
      # and timed out anyway. Measured: 23s to ready afterwards.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/mining-overview.json
    depends_on:
      - prometheus
    networks:
      - mining-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mining-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana-storage:
  alertmanager_data:
  # Action budget and link state for the WAN watchdog; see DMI-49.
  watchdog_state:
