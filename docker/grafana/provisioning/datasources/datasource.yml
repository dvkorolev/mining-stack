apiVersion: 1

# Recreate rather than update. Grafana cannot change the UID of an existing
# datasource through provisioning -- it fails with "data source not found" and
# leaves the old generated UID in place, so every dashboard referencing the
# pinned one breaks. Deleting first makes the pinning take effect on an existing
# install, and is a no-op on a fresh one.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  # A second, hand-created datasource named `prometheus` (lowercase) existed on
  # the Pi, pointing at http://localhost:9090 -- nothing, from inside Grafana's
  # container. Its name collided with the UID pinned below, and Grafana resolved
  # a dashboard's `uid: prometheus` to it by NAME, so every panel on the Network
  # Traffic dashboard failed with "An error occurred within the plugin"
  # (plugin.requestFailureError, connection refused).
  #
  # Listed here so a rebuilt install cannot inherit it. Deletion runs before the
  # datasources below are created, so this is safe even if a future Grafana
  # matches names case-insensitively -- the real one is recreated immediately.
  - name: prometheus
    orgId: 1

datasources:
  - name: Prometheus
    # Pinned so dashboards can reference it by a UID that is the same on every
    # install. Without this Grafana generates one (PBFA97CFB590B2093 here), and a
    # dashboard carrying that value works on this Pi and nowhere else -- which
    # matters precisely when rebuilding the machine.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "30s"
