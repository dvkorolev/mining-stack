apiVersion: 1

# Recreate rather than update. Grafana cannot change the UID of an existing
# datasource through provisioning -- it fails with "data source not found" and
# leaves the old generated UID in place, so every dashboard referencing the
# pinned one breaks. Deleting first makes the pinning take effect on an existing
# install, and is a no-op on a fresh one.
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    # Pinned for the same reason as Prometheus: dashboards reference it by UID,
    # and a generated one differs per install. Referencing it as "Loki" -- the
    # name -- is what silently broke the Router Syslog dashboard: the frontend
    # resolves a name for some panels, but /api/ds/query answers
    # "Data source not found" and template variables never populate.
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Link to traces if you add tracing later
        - datasourceUid: tempo
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
