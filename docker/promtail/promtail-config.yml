server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      
      # Extract container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      
      # Extract log stream (stdout/stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      
      # Extract compose service name if available
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
    
    pipeline_stages:
      # Try to parse as JSON (for structured logs)
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            logger: logger
            message: message
            hostname: hostname
            extra: extra
          source: message
      
      # Set timestamp from parsed JSON if available
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          action_on_failure: skip
      
      # Extract labels from JSON fields
      - labels:
          level:
          service:
          logger:
          hostname:
      
      # Output the message field (or original if not JSON)
      - output:
          source: message

  # Keenetic router syslog. The router's own log is RAM-only and is wiped on every
  # power-cycle, so the 2026-08-07 site outage could not be investigated after the
  # fact; shipping it into Loki keeps it across reboots.
  #
  # The router emits RFC3164 (BSD) syslog, so this needs promtail >= 3.1 for
  # `syslog_format` — on 2.9.0 the datagrams arrive but are silently discarded.
  # Router side (not tracked here): `system log server <pi-ip>:1514`.
  - job_name: keenetic-syslog
    syslog:
      listen_address: 0.0.0.0:1514
      listen_protocol: udp
      syslog_format: rfc3164
      idle_timeout: 60s
      label_structured_data: false
      labels:
        job: keenetic-syslog
    relabel_configs:
      - source_labels: ['__syslog_message_hostname']
        target_label: 'host'
      - source_labels: ['__syslog_message_severity']
        target_label: 'severity'
      - source_labels: ['__syslog_message_app_name']
        target_label: 'app'
