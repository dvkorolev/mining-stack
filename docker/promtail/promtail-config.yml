server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    
    relabel_configs:
      # `job_name` above is NOT a label. Unlike a Prometheus scrape config,
      # promtail's service discovery does not synthesise `job` from it, so
      # until 2026-08-21 every docker stream reached Loki without one and
      # `{job=~".+"}` matched nothing but the router syslog -- on every day
      # since this stack was deployed. An ad-hoc query written that way reads
      # as total data loss, and on 2026-08-20 it was read exactly that way
      # (DMI-70). Set it explicitly; the keenetic job below always did.
      - target_label: 'job'
        replacement: 'docker'

      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      
      # Extract container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      
      # Extract log stream (stdout/stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      
      # Extract compose service name if available
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
    
    # No pipeline_stages, on purpose. There used to be four -- json / timestamp
    # / labels / output -- and none of them ever ran: the json stage carried
    # `source: message`, naming an extracted field that does not exist on the
    # first stage, so it never parsed and the three stages behind it never
    # applied. Loki has no `level`, `service`, `logger` or `hostname` label to
    # this day (DMI-70).
    #
    # Lines are therefore stored verbatim, and that is what the Grafana
    # dashboards depend on: every panel in logs-overview.json parses with
    # `| json` at query time. Do not "repair" the old pipeline -- restoring
    # `output: source: message` would strip the JSON those panels read, and an
    # ingest-time `level` label would collide with the one `| json` extracts.

  # Keenetic router syslog. The router's own log is RAM-only and is wiped on every
  # power-cycle, so the 2026-08-07 site outage could not be investigated after the
  # fact; shipping it into Loki keeps it across reboots.
  #
  # The router emits RFC3164 (BSD) syslog, so this needs promtail >= 3.1 for
  # `syslog_format` — on 2.9.0 the datagrams arrive but are silently discarded.
  # Router side (not tracked here): `system log server <pi-ip>:1514`.
  - job_name: keenetic-syslog
    syslog:
      listen_address: 0.0.0.0:1514
      listen_protocol: udp
      syslog_format: rfc3164
      idle_timeout: 60s
      label_structured_data: false
      labels:
        job: keenetic-syslog
    relabel_configs:
      - source_labels: ['__syslog_message_hostname']
        target_label: 'host'
      - source_labels: ['__syslog_message_severity']
        target_label: 'severity'
      - source_labels: ['__syslog_message_app_name']
        target_label: 'app'
