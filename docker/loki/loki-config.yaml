auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Go kills the connection if the response is not fully written within this
  # window, so it is effectively the ceiling on how long a query may take.
  # At the 30s default a 7-day range died at ~70s with "i/o timeout" even
  # though the query itself had succeeded — the client just saw a dropped
  # connection. Wide ranges are exactly what this dashboard is for when
  # reconstructing an outage, so the ceiling has to clear them.
  http_server_write_timeout: 180s
  http_server_read_timeout: 180s
  # Loki logs 7602 lines/hour at `info`, and ~99% of it is the compactor
  # narrating itself ("compacting table", "building table cache") every ten
  # minutes. That is more than the backend and scheduler combined, so shipping
  # Loki's own log into Loki -- which is what DMI-70 needs, since it had no
  # record of its own behaviour during the incident -- is only affordable at
  # `warn`. Raise this to `info` by hand while debugging the store itself.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# No query_range block. It used to define an embedded results cache, and
# `/config` reported `cache_results: false` the whole time -- Loki never
# consulted it. Left in place it invites exactly the wrong conclusion during an
# incident: a cache is the first suspect when a query returns emptiness it
# should not, and this one was a decoy (DMI-70). If results caching is ever
# wanted, `cache_results: true` is the setting that actually turns it on.

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# The ruler is what monitors the READ path (DMI-70). Prometheus can measure
# what promtail sends and what Loki ingests, but neither says whether the data
# can be queried back -- and that is precisely the half that failed: ingestion
# was healthy throughout the incident while queries returned nothing.
#
# `alertmanager_url` pointed at localhost:9093 until 2026-08-21. Inside this
# container that is nothing at all, so a rule firing here would have gone
# nowhere -- the same shape of failure as DMI-65, one layer down.
ruler:
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/ruler-wal
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# Enable log volume for Grafana
limits_config:
  volume_enabled: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_cache_freshness_per_query: 10m
  # Sized for a Pi 4 serving multi-panel dashboards, not for a cluster.
  #
  # Every query is split into one subquery per interval, and each dashboard
  # panel issues its own query at the same moment. At the previous 15m the
  # Router Syslog dashboard (5 panels) generated ~120 subqueries for its
  # default 6h range and overflowed the scheduler queue below, so two panels
  # returned HTTP 429 "too many outstanding requests" on every load — 24h
  # would have been ~480. At 1h the same dashboard costs ~30.
  #
  # Splitting finer buys parallelism this host does not have: the Pi has 4
  # cores, so 32-way parallelism per query only fills the queue faster. The
  # data is ~18 MB/day, small enough that coarse splits are not a problem.
  split_queries_by_interval: 1h
  max_query_parallelism: 8

# The queue that was actually overflowing. Loki's default is 100, which two
# concurrent dashboard panels can exhaust on their own. Queuing a subquery
# costs a little latency; rejecting it shows the user an error, so prefer a
# deep queue over a shallow one.
query_scheduler:
  max_outstanding_requests_per_tenant: 2048

# Table manager for retention
table_manager:
  retention_deletes_enabled: false
  retention_period: 0s

# Compactor for cleanup
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: false
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
