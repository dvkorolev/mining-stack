# Prometheus Configuration for Mining Stack
# Comprehensive monitoring setup for all services

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s
  external_labels:
    cluster: 'mining-stack'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      timeout: 10s

# Alert rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # ============================================================================
  # Self-Monitoring
  # ============================================================================
  
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s

  # ============================================================================
  # Mining Stack Services
  # ============================================================================
  
  # Python Scheduler - Mining metrics collection service
  - job_name: "python-scheduler"
    static_configs:
      - targets: ["python-scheduler:8000"]
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: true

  # Backend API - Node.js service
  - job_name: "backend"
    static_configs:
      - targets: ["backend:5000"]
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # Keenetic router - uplink health and traffic accounting (DMI-47)
  #
  # Answers the two questions the site could not answer live: is the 4G link
  # healthy, and where does the traffic actually go. Byte counters come from the
  # router's IF-MIB over SNMP; signal and session state come from its RCI API.
  - job_name: "router"
    static_configs:
      - targets: ["router-exporter:9101"]
    metrics_path: /metrics
    # Polling the router costs three SNMP walks plus two RCI calls, so keep it
    # slower than the fleet scrape. Traffic counters do not need finer resolution.
    scrape_interval: 60s
    scrape_timeout: 30s

  # Grafana - Visualization service
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 10s

  # ============================================================================
  # The log pipeline itself (DMI-70)
  # ============================================================================
  #
  # Neither of these was scraped until 2026-08-21, so nothing measured whether
  # logs were reaching the store — while a comment in docker-compose.logging.yml
  # asserted that promtail liveness was "observable via promtail's own /metrics
  # (scraped by Prometheus)". It was not.
  #
  # These two cover the WRITE path only. They would not have caught the DMI-70
  # incident, where ingestion stayed healthy and the read path went blind; that
  # half needs a query, so it lives in Loki's own ruler (docker/loki/rules/).

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 10s

  - job_name: "promtail"
    static_configs:
      - targets: ["promtail:9080"]
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 10s

  # Host metrics for the Pi. Without this job the node_* series do not exist,
  # and HighCPUUsage / HighMemoryUsage / LowDiskSpace in mining_alerts.yml are
  # rules that can never fire (verified 2026-08-29: count(node_cpu_seconds_
  # total) returned no series).
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 10s

  # ============================================================================
  # External Monitoring - Blackbox Exporter
  # ============================================================================
  
  # Blackbox TCP - Mining pool connectivity checks
  #
  # The target list is currently empty on purpose: it watched seven pools the
  # farm does not use, and probe_success against a pool measures the pool's
  # tolerance of bare TCP connects, not our connectivity — reading it as uplink
  # availability produced a wrong outage diagnosis (DMI-46/56). Use
  # miner_pool_alive for pool health and the fleet share rate for availability.
  # Read targets/README.md before adding anything back.
  - job_name: 'blackbox-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/pools.json
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s
    scrape_timeout: 10s
