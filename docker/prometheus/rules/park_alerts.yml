# Park rules (DMI-109): "a machine is standing still" and "the site's power
# just sagged", as native Prometheus rules.
#
# Validated as a prototype first (tools/park_watch.py on the dev Mac, plan
# section 3a): its very first run caught a live trip on .122. The prototype
# stays as a manual --dry / --selfcheck utility; these rules are the always-on
# version -- the Mac is a workstation with no cron, per the owner's 2026-09-18
# decision that all monitoring lives on the Pi.
#
# `component: farm` on every rule is load-bearing, not decoration: this site
# sets ALERT_NOTIFY_EXCLUDE_COMPONENTS=miner (per-machine heat and error codes
# are recorded and dashboarded, never pushed -- DMI-79), and a rule labelled
# component: miner would be silently born suppressed. Every rule here exists to
# wake someone, so they are farm-level by label and by nature.
#
# Staleness is deliberately not one of them. The old ParkMinerStale asked
# `time() - timestamp(miner_power_watts) > 900`, which cannot fire: Prometheus
# drops a series after its 5-minute lookback, long before its age reaches
# 900 s. The scheduler-level equivalent lives in scheduler_alerts.yml
# (`SchedulerCollectionStale` / `SchedulerDown`, DMI-178).
#
# Machines with role=stand are excluded everywhere power is counted, through
# the inventory-published `miner_role` series rather than a literal IP list
# (DMI-179): a PromQL rule cannot read SQLite, so the scheduler exports
# `miner_role{ip,name,role}` and the rules join on (ip,name). `.58` and `.117`
# are the current stand machines -- stopped deliberately, 107 W and 168 W
# against 2.9-3.6 kW on the production fleet -- and would otherwise fire every
# park rule forever.
#
# The join direction is deliberate: `unless on(ip,name) miner_role{role="stand"}`
# fails toward alerting. If the series is missing (a scheduler older than these
# rules, or a fallback config with no roles), nothing is excluded and the
# machine still alerts -- one notification too many, never a silent exclusion.
groups:
  - name: park
    interval: 30s
    rules:
      # 500 W splits this fleet's two power populations with room on both
      # sides: mining machines draw 2900-3630 W, a tripped or idle one
      # 107-168 W (measured 2026-08-28). max_over_time is the deliberate
      # semantics -- "every reading in the window was low" -- because that
      # is what "the machine has been standing for 15 minutes" means. A
      # reboot ramp sits below 500 W for 1-2 min (measured over the month,
      # miner-ops 2026-09-18), and the min-variant would have paged on every
      # recovering machine, ~2 false alarms a day, all at the moment things
      # got better. Brief single dips (<0.5% of all dark minutes) are
      # swallowed on purpose: they are ParkPowerEvent's and the error-code
      # counter's business, not a per-machine warning's.
      - alert: ParkMinerDark
        expr: (max_over_time(miner_power_watts[15m]) < 500) unless on(ip,name) miner_role{role="stand"}
        labels:
          severity: warning
          component: farm
        annotations:
          summary: "Miner {{ $labels.name }} at or below {{ $value | printf \"%.0f\" }}W for the whole last 15m"
          description: "Every reading in the last 15m was under 500W; a machine that keeps mining sits at 2.9-3.6kW. Reboot ramps (1-2min) do not fire this."

      # The DG1+ publishes a constant 3400 W -- `stddev_over_time[6h]` = 0 --
      # so the power-based rules above cannot see it stop. Its hashrate is a
      # real reading and it is the fleet's only scrypt series; 15m of zeros is
      # the same "standing still" semantics as ParkMinerDark, on the quantity
      # that actually moves. DMI-178 item 4; model labels are inconsistent
      # across the park, so this discriminates on `algorithm` instead.
      - alert: ParkScryptIdle
        expr: (max_over_time(miner_hashrate_mhs{algorithm="scrypt"}[15m]) == 0) unless on(ip,name) miner_role{role="stand"}
        labels:
          severity: warning
          component: farm
        annotations:
          summary: "Scrypt miner {{ $labels.name }} at 0 MH/s for the whole last 15m"
          description: "Every reading in the last 15m was 0. The DG1+ reports a constant power figure, so hashrate is the signal that can see it standing still."

      # The main signal (plan 3a: 85% of the month's losses). Three or more
      # machines with a sub-500 W reading inside 15 m is a site event -- a
      # mains sag or a manual walk-through -- not any single machine's own
      # fault; the 2026-09-17 10:05 sag stamped code 205 onto four machines.
      # Single-machine trips stay ParkMinerDark's business.
      # min semantics here is deliberate, the mirror of ParkMinerDark's max:
      # any dip counts, so this is the early signal. It honestly sees all
      # three site-scale shapes -- a sag, an owner-driven mass reboot, and a
      # mass recovery ramp -- and all three are worth a look.
      - alert: ParkPowerEvent
        expr: count((min_over_time(miner_power_watts[15m]) < 500) unless on(ip,name) miner_role{role="stand"}) >= 3
        labels:
          severity: critical
          component: farm
        annotations:
          summary: "{{ $value }} miners under 500W in the last 15m"
          description: "Power sag or a manual walk-through at the site. This is the signal that catches the night events."

      # 190 V is below everything healthy and above the sag: fleet PSU input
      # measured 218.5-225.75 V (DMI-94), and the 2026-09-16 sag reached
      # 172 V before the trace vanished. Deliberately no window and no `for`:
      # the plan asks for the sag in the open, not after a wait. Stand machines
      # are excluded like everywhere else (DMI-179): a parked machine's supply
      # is not a farm signal, and it would otherwise be the one machine whose
      # PSU trip fires a single-machine alert. `.78` publishes nothing here
      # (different protocol), so it cannot appear either way.
      - alert: ParkVinLow
        expr: (miner_psu_input_volts < 190) unless on(ip,name) miner_role{role="stand"}
        labels:
          severity: warning
          component: farm
        annotations:
          summary: "Miner {{ $labels.name }} PSU input {{ $value | printf \"%.1f\" }}V"
          description: "Below 190V (fleet norm 219-226V) -- mains sag visible in the open, no window wait."

      # The cluster form of ParkVinLow: three or more supplies seeing the
      # same low mains at once is the site's input, not any one PSU.
      - alert: ParkVinCluster
        expr: count((miner_psu_input_volts < 190) unless on(ip,name) miner_role{role="stand"}) >= 3
        labels:
          severity: critical
          component: farm
        annotations:
          summary: "{{ $value }} miners under 190V PSU input"
          description: "Cluster sag on the mains side; single-machine dips stay ParkVinLow's business."

      # --- Channel discriminator (DMI-243) -------------------------------------
      #
      # 2026-10-11 was an uplink cut, not a power sag, and until this rule the
      # stack could not tell the two apart: both arrive as "the park went dark",
      # and ParkPowerEvent's 15-minute window reported the cut ~10 minutes after
      # the machines started dropping. Power was never involved -- PSU input
      # read 214 -> 227 V through the event and no machine carried code 251.
      #
      # `miner_pool_alive` is the discriminator, read PER MACHINE. A machine
      # whose every pool is dead is a machine that answered us, has pools
      # configured, and can reach none of them: the LAN is fine, the path out is
      # not. Two properties make the count mean exactly that:
      #   * a machine that reports no identifiable pool publishes NO series
      #     (`set_miner_pools`), and an unreachable machine has its series
      #     removed (`main.py`), so silence is never counted as a dead pool;
      #   * backup pools are dead as a matter of course (`.52`/`.145` all week),
      #     which is why the max is taken by (ip): the question is "every pool
      #     dead", not "a pool series reads 0". Counted per series, the same
      #     query produced 41 episodes in 30 days, all noise.
      # Calibration (miner-ops, 30 days at 5 m steps, this stack's Prometheus):
      # the count is non-zero in 10 of 8603 points -- 2026-10-11 15:42-16:02
      # with 18 machines, plus four single-machine blips elsewhere. `>= 3`
      # therefore yields exactly one episode in 30 days, and it is the uplink
      # outage. It reached 18 four minutes BEFORE the park went dark (15:42 vs
      # 15:46), which no power-based rule can do by construction: their windows
      # are 15 minutes long.
      #
      # The stand join is on (ip) alone because `max by (ip)` has dropped `name`;
      # `on (ip, name)` here would match nothing and silently exclude no one.
      #
      # Blind spot, deliberate: if the scheduler itself stops, there are no
      # series to count and this reads 0. SchedulerDown / SchedulerCollectionStale
      # (scheduler_alerts.yml) own that question.
      #
      # The recording rule lives in this group rather than a separate file so
      # that it cannot drift from the rules that read it; `or vector(0)` keeps
      # the series present in the healthy case, since `count` over an empty
      # vector returns no sample at all and every annotation that queries it
      # would then render an error instead of "0".
      - record: farm:no_live_pool:count
        expr: |
          count(((max by (ip) (miner_pool_alive)) == 0)
                unless on (ip) miner_role{role="stand"})
          or vector(0)

      # Critical, short `for`: the historical false positives were single
      # points, and one scrape-length blip must not wake anyone. The lead over
      # the machines going dark is ~4 minutes, so a 2-minute dwell keeps most
      # of it.
      - alert: ParkNoLivePool
        expr: farm:no_live_pool:count >= 3
        for: 2m
        labels:
          severity: critical
          component: farm
          class: uplink
        annotations:
          summary: "{{ $value }} miners have no live pool left"
          description: "Channel, not power: the miners cannot resolve or reach their pools, and ~300s of that makes btminer assert and drop the whole park. Mains voltage stays normal (10-11: 214-227 V, no code 251)."

      # The inverse, and the reason the pair is honest: a park that is dark
      # while the pools are alive is NOT a channel event. Stand machines are
      # excluded like everywhere else, otherwise the two parked machines would
      # be a permanent 2 of the 3 required -- measured live 2026-10-20 by
      # miner-ops: 2 without the exclusion, 0 with it. `count(miner_power_watts)
      # >= 15` is a collection-liveness guard: a total site power cut removes
      # the series instead of setting them low, and this rule would otherwise
      # read that as "dark with live pools". `and on ()` is explicit because
      # both sides are unlabelled after the aggregations.
      #
      # No `for`: the 15-minute window already means "dark for fifteen
      # minutes", so a second 15-minute dwell would make the diagnosis 30
      # minutes old while the description promises 15.
      - alert: ParkDarkWithLivePools
        expr: |
          (count((max_over_time(miner_power_watts[15m]) < 500) unless on(ip,name) miner_role{role="stand"}) >= 3)
          and on () (farm:no_live_pool:count < 3)
          and on () (count(miner_power_watts) >= 15)
        for: 0m
        labels:
          severity: info
          component: farm
          class: electric
        annotations:
          summary: "{{ $value }} miners dark for 15m, but their pools are alive"
          description: "Not the channel -- the path to the pools is working. Points at the mains, a manual walk-through or a mass reboot."
