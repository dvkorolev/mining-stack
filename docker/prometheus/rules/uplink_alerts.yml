# Uplink availability, measured from the fleet's own share submission.
#
# Rationale (DMI-46/56): the only trustworthy availability signal at this site is
# sum(rate(miner_pool_accepted_total[5m])) — real shares accepted by the pool, riding the
# production path across ~20 independent devices. Synthetic probing of a pool measures the
# pool's tolerance of us, not our connectivity; reading probe_success{job="pool-tcp-check"}
# that way produced a phantom 25% outage rate and a wrong outage diagnosis.
#
# What these rules are for: the 2026-08-09 15:00–16:30 UTC outage went unnoticed for four days
# and was only found by reading history. Nothing alerted, because every existing rule watches
# individual miners — and during an uplink loss the miners are all still reachable on the LAN,
# still report is_mining=1, and look perfectly healthy. Only the share counters stop moving.
#
# Both rules are gated on miner_scrape_status == 2 so that a miner whose gauges are stale in
# scheduler memory (DMI-55) cannot manufacture a share-stall that isn't happening.
groups:
  - name: uplink
    interval: 30s
    rules:
      # Critical: the whole fleet has stopped landing shares while it is still mining.
      # This is the signature of an uplink or pool-wide failure rather than a miner fault.
      #
      # The uplink is the first thing to check — but not the router, which sees only the
      # USB link to the dongle and reports it healthy right through an outage. Read the
      # 4G session on the dongle itself, and the operator's data allowance; the August
      # 2026 outages happened with money on the SIM and recovered on their own.
      - alert: FleetNoSharesAccepted
        expr: |
          sum(rate(miner_pool_accepted_total[5m])) == 0
          and count(miner_scrape_status == 2) > 0
        for: 5m
        labels:
          severity: critical
          component: uplink
        annotations:
          summary: "Fleet has accepted no shares for 10 minutes"
          description: "Miners are reachable and mining, but earning nothing. Check the 4G session on the dongle, not the router."

      # Warning: one miner is mining into nothing while the rest of the fleet is fine.
      # Points at that miner's pool configuration or credentials, not at the uplink.
      # At this fleet's hashrate a healthy miner lands several shares per minute.
      - alert: MinerNoSharesAccepted
        expr: |
          (
            rate(miner_pool_accepted_total[15m]) == 0
            and miner_scrape_status == 2
            and miner_is_mining == 1
          ) unless on(ip,name) miner_role{role="stand"}
        for: 15m
        labels:
          severity: warning
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} is mining but landing no shares"
          description: "No accepted share in 30m from {{ $labels.ip }} — pool or credentials on that machine."

      # The channel itself (DMI-243). This is the only rule here that reads a router
      # metric, and it reads the two fields that mean different things:
      #
      #   * `router_uplink_connected` is the interface's own "established connection"
      #     flag (`router-exporter/router_exporter.py`, `parse_uplink`). This is the
      #     half DMI-243 (a) found missing: the site-local `FarmChannelReset` on the
      #     Pi watches `router_uplink_uptime_seconds < 900` only, so a link that was
      #     down with an uptime that never reset was covered by nothing.
      #   * a reset of `router_uplink_uptime_seconds` is the interface starting its
      #     uptime again, i.e. a re-established connection. On this site's history it
      #     was the 2/2 mark of the channel events (2026-09-26 04:06 and 2026-10-11
      #     15:41); the second is the reset that preceded the whole park going dark
      #     at 15:46.
      #     ⚠️ `changes(...) > 0` -- the form DMI-243 proposed -- is WRONG here and
      #     the unit test refused it: uptime goes up every scrape, and `changes()`
      #     counts any change, so that arm is true on a healthy link in every
      #     window. `resets()` counts decreases, which is what a reconnect is.
      #
      # `router_uplink_up` is deliberately NOT read here: it is the USB link to the
      # dongle and it stayed up through a 2h29m outage (the rejected-signals table in
      # PROJECT_STATE.md). It says the wire is attached, not that the wire carries
      # anything.
      #
      # ⚠️ Evidence status: the uptime-reset arm is measured (2/2 channel events).
      # The `connected == 0` arm has NOT yet been observed at 0 on this site -- it is
      # the gap DMI-243 names, and the first deploy must read the series back and
      # check the 2026-10-11 window before the rule is called verified (PROJECT_STATE
      # rule 5). Until then this is a rule that loads, not a rule that is known to
      # fire; saying otherwise is the mistake DMI-178 catalogues.
      #
      # Severity is critical because of the deadline: btminer asserts after ~300 s
      # with no pool and the park goes dark on its own. The 2-minute `for` keeps most
      # of that lead over the machines.
      #
      # Failure direction: if the exporter cannot reach the router, these series
      # disappear and the rule cannot fire -- one alert too few, never a fabricated
      # one. `router_up == 0` is the metric that would report the exporter's own
      # failure and nothing watches it yet; that gap is recorded on DMI-243 rather
      # than guessed at here.
      - alert: FarmChannelDown
        expr: |
          max by (interface) (router_uplink_connected == 0)
          or
          max by (interface) (resets(router_uplink_uptime_seconds[5m]) > 0)
        for: 2m
        labels:
          severity: critical
          component: uplink
        annotations:
          summary: "Farm uplink down or just reset on {{ $labels.interface }}"
          description: "The router reports no established connection (or its uptime reset). The park starts dropping ~300s later, when btminer sees no pool. Check the 4G session on the dongle and the data allowance; the August outages recovered by themselves."

  # The uplink is metered 4G, so its capacity is a shared resource the fleet competes for.
  # Volume is attributed per LAN host by the router (router_host_* from `show/ip/hotspot`).
  - name: uplink_consumers
    interval: 60s
    rules:
      # A machine that is not part of the fleet has become a major consumer of the link.
      #
      # Threshold, from measurement on 2026-08-14 rather than taste: the whole WAN carried
      # 714 MB in 24h, of which all 19 miners together took ~180 MB (~9 MB each), while a
      # single spare workstation sharing the rack room took 203 MB — 28% of the link on its
      # own. 500 MB is 2.5x that host's normal draw, so it does not flap, and roughly a
      # quarter of the 1.8 GB/day a Wi-Fi client pulled in early August, so it fires with
      # plenty of room before a repeat.
      #
      # router_host_* under-reports (the exporter says so). That biases this rule towards
      # firing late, never early — the safe direction for a threshold.
      #
      # This rule says how much and by which host; it cannot say what the traffic is,
      # because the router attributes volume per host and not per destination. To find
      # out what is being transferred, look at the host itself.
      - alert: NonFleetHostConsumingUplink
        expr: |
          sum by (name, ip, mac) (
            increase(router_host_rx_bytes_total{name!~"WhatsMiner.*|Antminer.*|DG1.*|raspberrypi.*"}[24h])
            + increase(router_host_tx_bytes_total{name!~"WhatsMiner.*|Antminer.*|DG1.*|raspberrypi.*"}[24h])
          ) > 500e6
        for: 30m
        labels:
          severity: warning
          component: uplink
        annotations:
          summary: "{{ $labels.name }} used {{ $value | humanize1024 }}B of the metered uplink in 24h"
          description: "{{ $labels.ip }} is not a miner. Miners use ~9 MB/day each; the link is metered."
