# Uplink availability, measured from the fleet's own share submission.
#
# Rationale (DMI-46/56): the only trustworthy availability signal at this site is
# sum(rate(miner_pool_accepted_total[5m])) — real shares accepted by the pool, riding the
# production path across ~20 independent devices. Synthetic probing of a pool measures the
# pool's tolerance of us, not our connectivity; reading probe_success{job="pool-tcp-check"}
# that way produced a phantom 25% outage rate and a wrong outage diagnosis.
#
# What these rules are for: the 2026-08-09 15:00–16:30 UTC outage went unnoticed for four days
# and was only found by reading history. Nothing alerted, because every existing rule watches
# individual miners — and during an uplink loss the miners are all still reachable on the LAN,
# still report is_mining=1, and look perfectly healthy. Only the share counters stop moving.
#
# Both rules are gated on miner_scrape_status == 2 so that a miner whose gauges are stale in
# scheduler memory (DMI-55) cannot manufacture a share-stall that isn't happening.
groups:
  - name: uplink
    interval: 30s
    rules:
      # Critical: the whole fleet has stopped landing shares while it is still mining.
      # This is the signature of an uplink or pool-wide failure rather than a miner fault.
      - alert: FleetNoSharesAccepted
        expr: |
          sum(rate(miner_pool_accepted_total[5m])) == 0
          and count(miner_scrape_status == 2) > 0
        for: 5m
        labels:
          severity: critical
          component: uplink
        annotations:
          summary: "Fleet has accepted no shares for 10 minutes"
          description: >-
            No miner has landed a share in the last 10 minutes, yet the miners are still
            reachable and mining. The fleet is producing hashes that earn nothing. The uplink
            is the first thing to check — but not the router, which sees only the USB link to
            the dongle and reports it healthy right through an outage. Read the 4G session on
            the dongle itself, and the operator's data allowance; the August 2026 outages
            happened with money on the SIM and recovered on their own.

      # Warning: one miner is mining into nothing while the rest of the fleet is fine.
      # Points at that miner's pool configuration or credentials, not at the uplink.
      - alert: MinerNoSharesAccepted
        expr: |
          rate(miner_pool_accepted_total[15m]) == 0
          and miner_scrape_status == 2
          and miner_is_mining == 1
        for: 15m
        labels:
          severity: warning
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} is mining but landing no shares"
          description: >-
            Miner {{ $labels.name }} ({{ $labels.ip }}) has accepted no shares for 30 minutes
            while reporting that it is mining. At this fleet's hashrate a healthy miner lands
            several shares per minute, so this is a pool or credentials problem on that machine.

  # The uplink is metered 4G, so its capacity is a shared resource the fleet competes for.
  # Volume is attributed per LAN host by the router (router_host_* from `show/ip/hotspot`).
  - name: uplink_consumers
    interval: 60s
    rules:
      # A machine that is not part of the fleet has become a major consumer of the link.
      #
      # Threshold, from measurement on 2026-08-14 rather than taste: the whole WAN carried
      # 714 MB in 24h, of which all 19 miners together took ~180 MB (~9 MB each), while a
      # single spare workstation sharing the rack room took 203 MB — 28% of the link on its
      # own. 500 MB is 2.5x that host's normal draw, so it does not flap, and roughly a
      # quarter of the 1.8 GB/day a Wi-Fi client pulled in early August, so it fires with
      # plenty of room before a repeat.
      #
      # router_host_* under-reports (the exporter says so). That biases this rule towards
      # firing late, never early — the safe direction for a threshold.
      - alert: NonFleetHostConsumingUplink
        expr: |
          sum by (name, ip, mac) (
            increase(router_host_rx_bytes_total{name!~"WhatsMiner.*|Antminer.*|DG1.*|raspberrypi.*"}[24h])
            + increase(router_host_tx_bytes_total{name!~"WhatsMiner.*|Antminer.*|DG1.*|raspberrypi.*"}[24h])
          ) > 500e6
        for: 30m
        labels:
          severity: warning
          component: uplink
        annotations:
          summary: "{{ $labels.name }} used {{ $value | humanize1024 }}B of the metered uplink in 24h"
          description: >-
            {{ $labels.name }} ({{ $labels.ip }}) is not a miner, yet it has moved
            {{ $value | humanize1024 }}B over the 4G link in the last 24 hours — against
            roughly 9 MB per miner. The link is metered and the fleet depends on it.
            This rule says how much and by which host; it cannot say what the traffic is,
            because the router attributes volume per host and not per destination. To find
            out what is being transferred, look at the host itself.
