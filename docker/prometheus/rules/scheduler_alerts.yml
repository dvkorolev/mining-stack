# Alerts on the collector itself, rather than on the miners it polls.
#
# Kept out of mining_alerts.yml on purpose: these are alerts about the
# collector, not about the miners it polls. Both files are hand-written; the
# generator that used to rewrite mining_alerts.yml was removed (DMI-177).
#
# DMI-58: the scheduler takes its miner list from the backend API and silently
# fell back to the example miners in etc/miners.yaml when the backend was not
# up yet. Collection then succeeded against the wrong list, so every existing
# alert stayed quiet — the fleet simply stopped being monitored.
groups:
  - name: scheduler_config
    interval: 30s
    rules:
      # Critical: polling whatever is in the YAML seed file, which ships
      # example miners (miner-01..04 at 192.168.1.100-103).
      - alert: SchedulerConfigYamlFallback
        expr: scheduler_config_source{source="yaml_fallback"} == 1
        for: 2m
        labels:
          severity: critical
          component: scheduler
        annotations:
          summary: "Scheduler is polling the YAML fallback miner list"
          description: "Backend API unreachable, nothing cached. Likely the example miners at 192.168.1.100-103, not the fleet."

      # Warning: backend unreachable, but the last known good list is still in
      # use — the fleet is monitored, inventory changes are not picked up.
      - alert: SchedulerConfigStale
        expr: scheduler_config_source{source="stale_cache"} == 1
        for: 15m
        labels:
          severity: warning
          component: scheduler
        annotations:
          summary: "Scheduler cannot reach the backend miner API"
          description: "Serving the last known good list for 15m. Collection continues; inventory changes are not picked up."

      # Critical: nothing is being polled at all.
      - alert: SchedulerNoMinersConfigured
        expr: scheduler_miners_configured == 0
        for: 5m
        labels:
          severity: critical
          component: scheduler
        annotations:
          summary: "Scheduler has no miners configured"
          description: "The active configuration is empty — nothing is being polled."

      # Warning: the list shrank sharply. Backstop for the DMI-58 failure mode
      # (25 miners becoming 5) that does not depend on the source label being
      # right. Fires on a real decommission too, which is worth a look anyway.
      - alert: SchedulerMinerCountDropped
        expr: scheduler_miners_configured < 0.8 * max_over_time(scheduler_miners_configured[24h])
        for: 10m
        labels:
          severity: warning
          component: scheduler
        annotations:
          summary: "Configured miner count dropped to {{ $value }}"
          description: "Under 80% of the 24h maximum. Either the fleet shrank in the DB, or the collector is on the wrong config."

  - name: scheduler_liveness
    interval: 30s
    rules:
      # The process is not being scraped at all. This was covered by nothing
      # before: the per-miner rules go quiet one at a time and
      # FarmMultipleMinersOffline needs most of the fleet to have been down
      # for its `for` first.
      - alert: SchedulerDown
        expr: up{job="python-scheduler"} == 0
        for: 5m
        labels:
          severity: critical
          component: scheduler
        annotations:
          summary: "python-scheduler is down"
          description: "Prometheus cannot scrape the scheduler. Nothing is being collected while this is true."

      # The process is up but the collection loop is not completing: a wedged
      # loop, a hung 4028 read, a deadlock. DMI-178 moved this here from
      # ParkMinerStale, which asked the same question per miner as
      # `time() - timestamp(miner_power_watts) > 900` — unreachable, because
      # PromQL's 5-minute lookback drops the series long before its age can
      # reach 900 s. The scheduler keeps exposing this gauge while it is alive,
      # so the age is observable; when the process dies, SchedulerDown is the
      # rule that fires.
      - alert: SchedulerCollectionStale
        expr: time() - max(mining_collection_timestamp_seconds) > 900
        for: 2m
        labels:
          severity: critical
          component: scheduler
        annotations:
          summary: "Scheduler collection is stale"
          description: "No collection recorded for over 15m while the process is up. The collection loop is not completing; the fleet is unmonitored."
