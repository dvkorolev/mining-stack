groups:
  - name: mining_critical
    interval: 30s
    rules:
      # Critical: Miner is offline
      - alert: MinerOffline
        expr: miner_scrape_status <= 0
        for: 5m
        labels:
          severity: critical
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} offline"
          description: "Unreachable for 5m."
          
      # Critical: High temperature
      #
      # ⚠️ This watches miner_temp_max_c, which is the *board* (PCB) temperature.
      # The chips on that board run 20-30 °C hotter — see MinerBoardChipTempCritical
      # below, which is the rule that catches an overheating hashboard. This one is
      # kept unchanged deliberately: redefining what miner_temp_max_c means would
      # silently move every threshold built on it.
      - alert: MinerHighTemperature
        expr: miner_temp_max_c > 85
        for: 2m
        labels:
          severity: critical
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} board {{ $value | printf \"%.0f\" }}°C — critical"
          description: "Board (PCB) temp, limit 85°C. Chips run 20-30°C hotter."

      # Critical: a hashboard's chips are running hot (DMI-64)
      #
      # This is the reading nothing watched until 2026-08-14. `miner_temp_max_c`
      # reports the board, and on this fleet the hottest chip on that board runs
      # 20-30 °C above it — so a machine reporting a comfortable 79 °C was found
      # with chips at 109 °C, under every threshold that existed.
      #
      # Thresholds from the fleet's own distribution, measured 2026-08-14 across
      # the 12 miners whose firmware reports chip temperature. Hottest board per
      # miner: 90.3, 90.6, 93.4, 94.2, 95.3, 96.9, 96.9, 97.2, 97.7, 102.2, 102.9,
      # 109.4 — a body sitting at 90-98 and three machines clearly outside it. 100
      # is therefore "out of family for this farm", not a number from taste.
      # ⚠️ It is *not* a vendor limit: the MicroBT datasheet has not been read.
      # Confirm the real protection point and adjust, rather than trusting this.
      #
      # Alerts per board rather than per miner on purpose — the slot label is the
      # actionable part, since it points at which board to inspect.
      #
      # Sustained chip temperature at this level shortens board life and eventually
      # throttles the miner. The farm-wide cause found in DMI-45 was ventilation and
      # ambient temperature, which is why the annotation points at airflow first.
      - alert: MinerBoardChipTempCritical
        expr: miner_board_chip_temp_c > 105
        for: 5m
        labels:
          severity: critical
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} board {{ $labels.slot }} chips {{ $value | printf \"%.1f\" }}°C — critical"
          description: "Fleet norm is 90-98°C, limit 105°C. Check that board's airflow and fans."
          
      # Critical: Miner stopped mining
      - alert: MinerNotMining
        expr: miner_is_mining == 0 and miner_scrape_status == 2
        for: 5m
        labels:
          severity: critical
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} stopped mining"
          description: "Online but not mining for 5m."

      # Critical: Miner claims to be mining but produces nothing
      #
      # MinerNotMining above catches the honest failure — a miner that reports
      # is_mining=0. This catches the dishonest one, and until DMI-67 nothing did:
      # `miner_state` was documented as the fleet's state metric and referenced by
      # zero rules. In pyasic_collector.set_miner_metrics(), state is derived as
      #
      #   hashrate == 0 and not is_mining -> 1 (idle)     <- MinerNotMining fires
      #   hashrate  > 0                   -> 2 (mining)
      #   otherwise                       -> 0 (faulty)   <- nothing fired
      #
      # so state 0 means precisely "says it is mining, hashrate is zero". Note the
      # collector defaults a missing is_mining field to True, which lands the miner
      # here rather than in idle — one more reason this branch must be alerted on.
      #
      # Found live on 2026-08-20: whatsminer-058 and rebuildm303 sat at state 0 for
      # over an hour with a healthy scrape and nothing firing. Do not rewrite this as
      # a hashrate comparison — MinerHashrateCritical* already covers that and needs
      # miner_expected_hashrate_ths, which whatsminer_generic models do not publish.
      - alert: MinerFaulty
        expr: miner_state == 0 and miner_scrape_status == 2
        for: 10m
        labels:
          severity: critical
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} faulty — reports mining, hashrate 0"
          description: >-
            {{ $labels.model }}: hashrate 0 for 10m while drawing
            {{ with query (printf "miner_power_watts{name='%s'}" $labels.name) }}{{ . | first | value | printf "%.0f" }}{{ end }}W.

      # Critical: Hashrate dropped significantly (50% below expected) - SHA-256
      - alert: MinerHashrateCriticalSHA256
        expr: |
          (
            miner_hashrate_ths{algorithm="sha256"} < (miner_expected_hashrate_ths * 0.5)
            and miner_is_mining{algorithm="sha256"} == 1
            and miner_expected_hashrate_ths > 0
          )
        for: 10m
        labels:
          severity: critical
          component: miner
          algorithm: sha256
        annotations:
          summary: "Miner {{ $labels.name }} SHA-256 {{ $value | printf \"%.1f\" }} TH/s — critical"
          # No `expected_hashrate` label exists on any series; the rated figure lives in
          # the miner_expected_hashrate_ths metric, so state the threshold instead.
          description: "{{ $labels.model }}, below 50% of its rated hashrate."
      
      # Critical: Hashrate dropped significantly (50% below expected) - SCRYPT
      # Thresholds derived from the machine's own rate_ideal (14229 MH/s), not
      # from the inflated rate_5s the collector used to publish (DMI-75).
      # Critical is ~50% of nominal; the warning band below starts at ~85%.
      - alert: MinerHashrateCriticalSCRYPT
        expr: |
          (
            miner_hashrate_mhs{algorithm="scrypt"} < 7000
            and miner_is_mining{algorithm="scrypt"} == 1
          )
        for: 10m
        labels:
          severity: critical
          component: miner
          algorithm: scrypt
        annotations:
          summary: "Miner {{ $labels.name }} SCRYPT {{ $value | printf \"%.1f\" }} MH/s — critical"
          description: "Below the 7000 MH/s critical threshold; nominal is 14229 MH/s."

  - name: mining_warning
    interval: 30s
    rules:
      # Warning: Temperature elevated
      # Warning band for the chip temperature above (DMI-64). Bounded at the top so
      # a board past 105 raises MinerBoardChipTempCritical alone, not both. Not an
      # emergency: it is the early stage of the path MinerBoardChipTempCritical
      # describes, and it usually means airflow rather than the board itself.
      - alert: MinerBoardChipTempHigh
        expr: miner_board_chip_temp_c > 100 and miner_board_chip_temp_c <= 105
        for: 10m
        labels:
          severity: warning
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} board {{ $labels.slot }} chips {{ $value | printf \"%.1f\" }}°C"
          description: "Fleet norm is 90-98°C, critical at 105°C. Usually airflow, not the board."

      - alert: MinerTemperatureHigh
        expr: miner_temp_max_c > 75 and miner_temp_max_c <= 85
        for: 5m
        labels:
          severity: warning
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} board {{ $value | printf \"%.0f\" }}°C — elevated"
          description: "Board (PCB) temp, warning band 75-85°C. Chips run 20-30°C hotter."
          
      # Warning: Hashrate below expected (20% below expected) - SHA-256
      - alert: MinerHashrateWarningSHA256
        expr: |
          (
            miner_hashrate_ths{algorithm="sha256"} < (miner_expected_hashrate_ths * 0.8)
            and miner_hashrate_ths{algorithm="sha256"} >= (miner_expected_hashrate_ths * 0.5)
            and miner_is_mining{algorithm="sha256"} == 1
            and miner_expected_hashrate_ths > 0
          )
        for: 10m
        labels:
          severity: warning
          component: miner
          algorithm: sha256
        annotations:
          summary: "Miner {{ $labels.name }} SHA-256 {{ $value | printf \"%.1f\" }} TH/s — low"
          # See the note on MinerHashrateCriticalSHA256 about $labels.expected_hashrate.
          description: "{{ $labels.model }}, at 50-80% of its rated hashrate."
      
      # Warning: Hashrate below expected - SCRYPT
      - alert: MinerHashrateWarningSCRYPT
        expr: |
          (
            miner_hashrate_mhs{algorithm="scrypt"} < 12000
            and miner_hashrate_mhs{algorithm="scrypt"} >= 7000
            and miner_is_mining{algorithm="scrypt"} == 1
          )
        for: 10m
        labels:
          severity: warning
          component: miner
          algorithm: scrypt
        annotations:
          summary: "Miner {{ $labels.name }} SCRYPT {{ $value | printf \"%.1f\" }} MH/s — low"
          description: "Warning band 7000-12000 MH/s; nominal is 14229 MH/s."
          
      # Warning: Elevated rejection rate (2-5%)
      - alert: MinerRejectionRateWarning
        expr: |
          (
            rate(miner_pool_rejected_total[5m]) / 
            (rate(miner_pool_accepted_total[5m]) + rate(miner_pool_rejected_total[5m]))
          ) > 0.02 and (
            rate(miner_pool_rejected_total[5m]) / 
            (rate(miner_pool_accepted_total[5m]) + rate(miner_pool_rejected_total[5m]))
          ) <= 0.05
        for: 10m
        labels:
          severity: warning
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} rejecting {{ $value | humanizePercentage }} of shares"
          description: "Warning band 2-5%."
          
      # Critical: High rejection rate (>5%)
      - alert: MinerRejectionRateCritical
        expr: |
          (
            rate(miner_pool_rejected_total[5m]) / 
            (rate(miner_pool_accepted_total[5m]) + rate(miner_pool_rejected_total[5m]))
          ) > 0.05
        for: 10m
        labels:
          severity: critical
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} rejecting {{ $value | humanizePercentage }} of shares — critical"
          description: "Above the 5% critical threshold."
          
      # Warning: Fault light on
      - alert: MinerFaultLight
        expr: miner_fault_light_on == 1
        for: 2m
        labels:
          severity: warning
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} fault light on"
          
      # Warning: Errors detected
      #
      # Windowed on purpose (DMI-68). The bare `miner_errors_count > 0` with `for: 5m`
      # flapped: the miners' error lists genuinely empty out and refill between scrapes
      # — whatsminer-058 measured 2026-08-20 went 2,3,0,2,3,0 with miner_scrape_status
      # steady at 2 the whole time — so the `for` timer kept resetting and the alert
      # cycled every 10-20 minutes. That single miner produced 141 of the 239
      # notifications in the first day of restored delivery (DMI-65), which is how
      # alerting gets ignored.
      #
      # max_over_time keeps the alert up while errors recur and lets it resolve 15
      # minutes after the last one, trading resolve latency for a stable signal.
      # $value is therefore the worst count in the window, not the current one.
      - alert: MinerErrors
        expr: max_over_time(miner_errors_count[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }}: up to {{ $value }} errors in 15m"
          description: "Worst count in a rolling 15m window, not the current one."
          
      # Warning: Missing chips on hashboard
      #
      # The rule is left comparing raw counts on purpose. It spent months firing 21 times
      # against miners hashing above their rated speed, but the fault was upstream: the
      # collector published `board.chips or 0`, so a board pyasic said nothing about became
      # a confident zero (DMI-62). With that fixed, a board that does not report chips has
      # no series and cannot match here, and a board that reports a genuine shortfall still
      # does. Guarding the rule instead — on hashrate, or on count > 0 — would have hidden
      # exactly the fault it exists to catch.
      - alert: MinerMissingChips
        expr: |
          miner_board_chips_count < on(ip, name, slot) group_left() miner_board_chips_expected
        for: 10m
        labels:
          severity: warning
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} board {{ $labels.slot }}: {{ $value | printf \"%.0f\" }} chips"
          description: "Expected {{ with query (printf \"miner_board_chips_expected{name='%s',slot='%s'}\" $labels.name $labels.slot) }}{{ . | first | value | printf \"%.0f\" }}{{ end }} on this board."
          
      # Warning: Fan speed low (below 3000 RPM)
      - alert: MinerFanSpeedWarning
        expr: miner_fan_speed_rpm < 3000 and miner_fan_speed_rpm >= 2000 and miner_is_mining == 1
        for: 5m
        labels:
          severity: warning
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} fan {{ $labels.fan_id }} at {{ $value | printf \"%.0f\" }} RPM"
          description: "Warning band 2000-3000 RPM."
          
      # Critical: Fan speed critically low (below 2000 RPM)
      - alert: MinerFanSpeedCritical
        expr: miner_fan_speed_rpm < 2000 and miner_is_mining == 1
        for: 2m
        labels:
          severity: critical
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} fan {{ $labels.fan_id }} at {{ $value | printf \"%.0f\" }} RPM — critical"
          description: "Below the 2000 RPM critical threshold."
          
      # Warning: Poor efficiency
      - alert: MinerPoorEfficiency
        expr: miner_efficiency_j_th > 35
        for: 15m
        labels:
          severity: warning
          component: miner
        annotations:
          summary: "Miner {{ $labels.name }} efficiency {{ $value | printf \"%.1f\" }} J/TH"
          description: "Above the 35 J/TH threshold."
          
      # Critical: Zombie miner SHA-256 (reports hashrate but power is too low)
      # This detects miners that appear online with hashrate but are actually offline
      # Common after power outages when miner reports stale/cached data
      - alert: MinerZombieStateSHA256
        expr: |
          (
            miner_hashrate_ths{algorithm="sha256"} > 10
            and miner_power_watts < 200
            and miner_is_mining{algorithm="sha256"} == 1
          )
        for: 5m
        labels:
          severity: critical
          component: miner
          algorithm: sha256
        annotations:
          summary: "Miner {{ $labels.name }} zombie — {{ $value | printf \"%.1f\" }} TH/s at under 200W"
          description: "Drawing only {{ with query (printf \"miner_power_watts{name='%s'}\" $labels.name) }}{{ . | first | value | printf \"%.0f\" }}{{ end }}W — likely stale data after a power cut."
          
      # Critical: Zombie miner SCRYPT (reports hashrate but power is too low)
      - alert: MinerZombieStateSCRYPT
        expr: |
          (
            miner_hashrate_mhs{algorithm="scrypt"} > 100
            and miner_power_watts < 100
            and miner_is_mining{algorithm="scrypt"} == 1
          )
        for: 5m
        labels:
          severity: critical
          component: miner
          algorithm: scrypt
        annotations:
          summary: "Miner {{ $labels.name }} zombie — {{ $value | printf \"%.1f\" }} MH/s at under 100W"
          description: "Drawing only {{ with query (printf \"miner_power_watts{name='%s'}\" $labels.name) }}{{ . | first | value | printf \"%.0f\" }}{{ end }}W — likely stale data after a power cut."

  - name: mining_farm
    interval: 30s
    rules:
      # Farm-wide: Multiple miners offline
      - alert: FarmMultipleMinersOffline
        expr: count(miner_scrape_status <= 0) > 3
        for: 5m
        labels:
          severity: critical
          component: farm
        annotations:
          summary: "{{ $value }} miners offline"
          description: "More than 3 unreachable for 5m."
          
      # Farm-wide: Total hashrate drop - SHA-256
      - alert: FarmHashrateDropSHA256
        expr: |
          (
            sum(miner_hashrate_ths{algorithm="sha256"}) < 1500
            and count(miner_is_mining{algorithm="sha256"} == 1) > 10
          )
        for: 10m
        labels:
          severity: critical
          component: farm
          algorithm: sha256
        annotations:
          summary: "Farm SHA-256 at {{ $value | printf \"%.0f\" }} TH/s"
          description: "Below the 1500 TH/s floor, with 10+ miners still mining."
      
      # Farm-wide: Total hashrate drop - SCRYPT
      - alert: FarmHashrateDropSCRYPT
        expr: |
          (
            sum(miner_hashrate_mhs{algorithm="scrypt"}) < 7000
            and count(miner_is_mining{algorithm="scrypt"} == 1) > 0
          )
        for: 10m
        labels:
          severity: critical
          component: farm
          algorithm: scrypt
        annotations:
          summary: "Farm SCRYPT at {{ $value | printf \"%.0f\" }} MH/s"
          description: "Below the 7000 MH/s floor."
          
      # Farm-wide: High average temperature
      - alert: FarmHighTemperature
        expr: avg(miner_temp_max_c) > 80
        for: 10m
        labels:
          severity: warning
          component: farm
        annotations:
          summary: "Farm average board temp {{ $value | printf \"%.1f\" }}°C"
          description: "Board (PCB) temp averaged over the fleet; threshold 80°C."
          
      # Farm-wide: High power consumption
      - alert: FarmHighPowerConsumption
        expr: sum(miner_power_watts) > 70000
        for: 5m
        labels:
          severity: warning
          component: farm
        annotations:
          summary: "Farm drawing {{ $value | humanize }}W"
          description: "Above the 70kW threshold."

  - name: system
    interval: 30s
    rules:
      # System: High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "CPU {{ $value | printf \"%.0f\" }}% on {{ $labels.instance }}"
          description: "Above the 80% threshold for 5m."
          
      # System: High memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Memory {{ $value | printf \"%.0f\" }}% on {{ $labels.instance }}"
          description: "Above the 85% threshold for 5m."
          
      # System: Low disk space
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Disk {{ $value | printf \"%.0f\" }}% free on {{ $labels.instance }}"
          description: "Below the 15% free threshold on /."
