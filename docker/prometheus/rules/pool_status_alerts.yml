# Pool health as the miners themselves report it (DMI-56).
#
# These are now the only pool alerts. pool_network_alerts.yml was deleted along
# with the pool_network_* family it read: that was the scheduler's own bare-TCP
# probing of a configured list, the same measurement DMI-56 ruled out, and four
# of its gauges were constants — with ENABLE_ICMP_PING unset (the default, and
# what production ran) packet loss and all three ping gauges were written as a
# literal 0.0 every cycle, so three of its six rules could never fire.
#
# These rules read miner_pool_alive instead: every miner holds a real stratum
# session, so its verdict on a pool cannot be confused with a pool refusing bare
# TCP connects from a prober — the mistake that produced the retracted
# availability figure in DMI-46.
groups:
  - name: pool_status
    interval: 30s
    rules:
      # Critical: a miner has no usable pool left, so it cannot submit work
      # regardless of how healthy the hardware looks.
      - alert: MinerNoLivePool
        expr: max by (ip, name) (miner_pool_alive) == 0
        for: 10m
        labels:
          severity: critical
          component: pool
        annotations:
          summary: "Miner {{ $labels.name }} has no live pool"
          description: "Every configured pool reports Dead — {{ $labels.ip }} cannot submit shares."

      # Critical: a pool is dead across most of the fleet, which points at the
      # pool or the uplink rather than at one machine.
      #
      # The `> 2` guard is not cosmetic. Without it a URL configured on a single
      # miner fires this as a fleet-wide emergency off a sample of one: on the
      # first deploy the DG1+'s two SCRYPT backups (ports 3434) showed as "100%
      # dead across the fleet", which is true and useless. Three miners is the
      # smallest sample where "most of the fleet" means anything.
      #
      # Restricted to primary pools for the same reason BackupPoolDead is info:
      # a backup dead across the fleet means failover is broken, which is worth
      # recording but costs nothing while the primaries hold. Without this the
      # same fact -- a dead backup -- would be info per miner and critical in
      # aggregate, which is incoherent. Backups are covered by BackupPoolDead.
      - alert: PoolDeadAcrossFleet
        expr: |
          (
            count by (url) (miner_pool_alive{pool_index="0"} == 0)
              / count by (url) (miner_pool_alive{pool_index="0"}) > 0.5
          )
          and count by (url) (miner_pool_alive{pool_index="0"}) > 2
        for: 10m
        labels:
          severity: critical
          component: pool
        annotations:
          summary: "Pool dead on {{ $value | humanizePercentage }} of the fleet"
          description: "{{ $labels.url }} — check the pool and the uplink before any single miner."

      # Critical: the pool a miner is actually mining on is dead. Backups exist,
      # but a miner that has failed over is earning at whatever the backup pays
      # and nobody would otherwise notice.
      - alert: PrimaryPoolDead
        expr: miner_pool_alive{pool_index="0"} == 0
        for: 15m
        labels:
          severity: critical
          component: pool
        annotations:
          summary: "Primary pool dead on {{ $labels.name }}"
          description: "{{ $labels.url }} Dead for 15m — failed over to a backup, or not mining."

      # Info: a backup pool is dead. Worth knowing, because failover will not
      # work, but it costs nothing right now and must not read as an incident.
      #
      # Deliberately not a warning: 13 of the fleet's backups were dead on the
      # day this shipped while all 19 primaries were alive and the farm ran at
      # full hashrate. Alerting on that at warning severity would bury the
      # things that do need action -- the mistake MinerMissingChips makes
      # today with 21 permanently-firing false positives (DMI-62).
      - alert: BackupPoolDead
        expr: miner_pool_alive{pool_index!="0"} == 0
        for: 6h
        labels:
          severity: info
          component: pool
        annotations:
          summary: "Backup pool dead on {{ $labels.name }}"
          description: "{{ $labels.url }} Dead for 6h. No impact until failover is needed."
