# Alerts on the log pipeline itself (DMI-70).
#
# Until 2026-08-21 Prometheus scraped neither Loki nor promtail, so the store
# that every post-mortem on this site depends on had no monitoring at all. It
# then spent eighteen hours unable to answer for the previous day and said
# nothing; it was found by inspection, like DMI-65 before it.
#
# These rules cover the WRITE path — what promtail read, what it shipped, what
# Loki accepted. That is deliberately only half. During the DMI-70 incident
# every one of these signals was healthy while queries returned emptiness, so a
# green board here is not evidence that logs are retrievable. The read path is
# watched by Loki's own ruler, in docker/loki/rules/fake/read_path_alerts.yml,
# because only a query can test it.
groups:
  - name: logging_pipeline
    interval: 30s
    rules:
      # The scrape targets themselves. Both of these also guard the rules
      # below: an `== 0` comparison against a metric that has stopped being
      # scraped yields an empty vector and stays silent, so without these two
      # a dead Loki would look identical to a healthy one.
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 5m
        labels:
          severity: critical
          component: logging
        annotations:
          summary: "Loki is not scrapeable"
          description: >-
            Nothing is being recorded durably while this is true. The router's
            own log is RAM-only and is lost on every power-cycle, so an outage
            that starts now cannot be reconstructed afterwards.

      - alert: PromtailDown
        expr: up{job="promtail"} == 0
        for: 5m
        labels:
          severity: critical
          component: logging
        annotations:
          summary: "Promtail is not scrapeable"
          description: >-
            Container logs and the Keenetic syslog both stop reaching Loki.
            Note promtail has no Docker healthcheck by design (DMI-15 — the
            image ships no shell or wget, so any CMD probe false-fails), which
            is why this scrape is the liveness signal.

      # Loki is up and accepting nothing. Distinct from PromtailDown: it also
      # covers promtail shipping into a store that rejects or discards.
      - alert: LokiIngestionStopped
        expr: sum(rate(loki_distributor_lines_received_total[10m])) == 0
        for: 15m
        labels:
          severity: critical
          component: logging
        annotations:
          summary: "Loki has ingested no log lines for 15 minutes"
          description: >-
            The stack produces roughly 6000 lines an hour without pause, so
            this is never a quiet period.

      # promtail's docker service discovery specifically. The syslog job has
      # its own counter and legitimately goes quiet — the router only logs on
      # events — so the two are not summed together here.
      - alert: PromtailDockerTargetsSilent
        expr: rate(promtail_docker_target_entries_total[10m]) == 0
        for: 15m
        labels:
          severity: warning
          component: logging
        annotations:
          summary: "Promtail is reading nothing from its Docker targets"
          description: >-
            Discovery filters on the container label `logging=promtail`; a
            container that loses the label is dropped silently. Six containers
            were unlabelled and therefore invisible until DMI-70 —
            alertmanager's among them, throughout the nine months its log was
            the only record of the 404 storm in DMI-65.

      - alert: PromtailPushFailing
        expr: sum(rate(promtail_request_duration_seconds_count{status_code!~"2.."}[10m])) > 0
        for: 10m
        labels:
          severity: warning
          component: logging
        annotations:
          summary: "Promtail's pushes to Loki are being rejected"
          description: >-
            Status {{ $labels.status_code }}. Promtail buffers and retries, so
            a short burst is survivable and a sustained one is data loss.

      - alert: PromtailDroppingEntries
        expr: sum by (reason) (rate(promtail_dropped_entries_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          component: logging
        annotations:
          summary: "Promtail is dropping log entries ({{ $labels.reason }})"
          description: >-
            Dropped entries are gone for good — there is no replay. This
            counter read 0 for every reason across 1.8M entries during the
            DMI-70 investigation, which is how promtail was cleared as the
            cause; it only carries that weight if something is watching it.

      - alert: PromtailConfigReloadFailing
        expr: increase(promtail_config_reload_fail_total[15m]) > 0
        labels:
          severity: warning
          component: logging
        annotations:
          summary: "Promtail rejected its configuration on reload"
          description: >-
            promtail runs with watchConfig enabled, so it reloads in place on
            file change and keeps running with the previous config when the new
            one fails to parse. The deploy looks successful and the change is
            not live.
