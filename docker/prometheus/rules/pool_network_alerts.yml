groups:
  - name: pool_network
    interval: 30s
    rules:
      # Critical: Pool unreachable
      - alert: PoolUnreachable
        expr: pool_network_reachable == 0
        for: 5m
        labels:
          severity: critical
          component: network
        annotations:
          summary: "Pool {{ $labels.pool }} unreachable"
          description: "Port {{ $labels.port }}, no response for 5m."
      
      # Critical: High packet loss
      - alert: PoolHighPacketLoss
        expr: pool_network_packet_loss_percent > 10
        for: 5m
        labels:
          severity: critical
          component: network
        annotations:
          summary: "Pool {{ $labels.pool }} packet loss {{ $value | printf \"%.0f\" }}%"
          description: "Port {{ $labels.port }}, critical above 10%."
      
      # Warning: Elevated latency
      - alert: PoolHighLatency
        expr: pool_network_ping_avg_ms > 100
        for: 10m
        labels:
          severity: warning
          component: network
        annotations:
          summary: "Pool {{ $labels.pool }} latency {{ $value | printf \"%.0f\" }} ms"
          description: "Port {{ $labels.port }}, threshold 100 ms."
      
      # Warning: Packet loss detected
      - alert: PoolPacketLoss
        expr: pool_network_packet_loss_percent > 1 and pool_network_packet_loss_percent <= 10
        for: 10m
        labels:
          severity: warning
          component: network
        annotations:
          summary: "Pool {{ $labels.pool }} packet loss {{ $value | printf \"%.1f\" }}%"
          description: "Port {{ $labels.port }}, warning band 1-10%."
      
      # Warning: Slow connection
      - alert: PoolSlowConnection
        expr: pool_network_connect_time_ms > 1000
        for: 5m
        labels:
          severity: warning
          component: network
        annotations:
          summary: "Pool {{ $labels.pool }} connect took {{ $value | printf \"%.0f\" }} ms"
          description: "Port {{ $labels.port }}, threshold 1000 ms."
      
      # Warning: DNS resolution failure
      - alert: PoolDNSFailure
        expr: pool_network_dns_resolved == 0
        for: 5m
        labels:
          severity: warning
          component: network
        annotations:
          summary: "DNS lookup failed for {{ $labels.pool }}"
          description: "The hostname is not resolving. Check DNS on the Pi and the uplink."
