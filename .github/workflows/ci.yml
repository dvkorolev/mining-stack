name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      # CI=false prevents pre-existing ESLint warnings from failing the build;
      # can be tightened once warnings are resolved.
      - run: npm run build
        env:
          CI: 'false'

  scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml prometheus-client==0.19.0 requests
      - run: python -m py_compile python-scheduler/main.py python-scheduler/metrics.py python-scheduler/config.py python-scheduler/health_check.py python-scheduler/asic_profile_loader.py python-scheduler/rated_hashrate.py python-scheduler/v3_telemetry.py python-scheduler/state_manager.py python-scheduler/collectors/*.py python-scheduler/parsers/*.py python-scheduler/asic/*.py python-scheduler/asic/transport/*.py python-scheduler/asic/drivers/*.py
      - run: python bin/test_farm_init.py
      - run: python bin/test_wan_watchdog.py
      - run: python python-scheduler/test_metrics_cleanup.py
      # Run from the package dir: these modules import each other, and
      # asic_profile_loader and metrics, by bare name.
      - run: python test_config_source.py
        working-directory: python-scheduler
      - run: python test_pool_status.py
        working-directory: python-scheduler
      - run: python test_board_readings.py
        working-directory: python-scheduler
      - run: python test_psu_readings.py
        working-directory: python-scheduler
      - run: python test_asic_profile_matching.py
        working-directory: python-scheduler
      - run: python test_expected_hashrate.py
        working-directory: python-scheduler
      - run: python test_rated_hashrate.py
        working-directory: python-scheduler
      - run: python test_v3_telemetry.py
        working-directory: python-scheduler
      - run: python test_dockerfile_completeness.py
        working-directory: python-scheduler
      # DMI-136. These three are pyasic-free on purpose: the primary path must
      # be testable where pyasic is not installed, which is here.
      - run: python test_asic_parity.py
        working-directory: python-scheduler
      - run: python test_reading_compare.py
        working-directory: python-scheduler
      - run: python test_whatsminer_driver.py
        working-directory: python-scheduler
      # DMI-201. Reads parity.py's syntax, not its behaviour, so it would run
      # anywhere -- kept here for the same reason as the three above.
      - run: python test_parity_evidence.py
        working-directory: python-scheduler
      # DMI-211 and DMI-208. The first two reach a real collection cycle without
      # pyasic by stubbing its one import; the third reads the source rather
      # than importing anything from the scheduler.
      - run: python test_collection_path.py
        working-directory: python-scheduler
      - run: python test_collection_read_gating.py
        working-directory: python-scheduler
      - run: python test_metric_wiring.py
        working-directory: python-scheduler

  router-exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r router-exporter/requirements.txt
      - run: python -m py_compile router-exporter/router_exporter.py router-exporter/rci.py
      # Run from the package dir: router_exporter imports rci by bare name.
      - run: python test_router_exporter.py
        working-directory: router-exporter
