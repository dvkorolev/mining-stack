name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      # CI=false prevents pre-existing ESLint warnings from failing the build;
      # can be tightened once warnings are resolved.
      - run: npm run build
        env:
          CI: 'false'

  scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml prometheus-client==0.19.0
      - run: python -m py_compile python-scheduler/main.py python-scheduler/metrics.py python-scheduler/asic_profile_loader.py python-scheduler/collectors/*.py
      - run: python bin/test_farm_init.py
      - run: python python-scheduler/test_metrics_cleanup.py
      # Run from the package dir: these modules import asic_profile_loader and
      # metrics by bare name.
      - run: python test_asic_profile_matching.py
        working-directory: python-scheduler
      - run: python test_expected_hashrate.py
        working-directory: python-scheduler
